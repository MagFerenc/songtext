<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Most szól</title>
<style>
  html,body{height:100%; margin:0;}
  body{
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:#0b1220; color:#f9fafb;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  #idleScreen{display:flex; flex-direction:column; align-items:center; gap:16px;}
  h1{font-size:1.3rem; margin:0; color:#9ca3af; font-weight:500;}
  #waitMsg{font-size:1.1rem; color:#f9fafb; margin:0;}
  #qrBox{
    background:#fff; padding:14px; border-radius:14px; margin-top:10px;
  }
  #qrCaption{font-size:.85rem; color:#9ca3af; margin-top:8px;}

  #songScreen{
    display:none; width:100%; height:100%; position:fixed; inset:0;
    flex-direction:column; background:#0b1220;
  }
  #songTitleBar{
    padding:14px 18px; background:#111827; font-size:1.1rem; font-weight:700;
    border-bottom:1px solid #1f2937; text-align:left;
  }
  #songFrame{flex:1; width:100%; border:none; background:#fff; display:none;}
  #pdfContainer{
    flex:1; width:100%; overflow-y:auto; background:#fff; display:none;
    -webkit-overflow-scrolling:touch;
  }
  #pdfContainer canvas{display:block; width:100%; height:auto; margin:0 auto;}
  #pdfStatus{
    padding:20px; color:#374151; font-size:.95rem; background:#fff;
  }
  #miniQrBar{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:8px; background:#111827; border-top:1px solid #1f2937;
    flex-shrink:0;
  }
  #miniQrBar span{font-size:.75rem; color:#9ca3af;}
  #miniQr{background:#fff; padding:4px; border-radius:8px; line-height:0;}
  #miniQr img, #miniQr canvas{display:block; width:48px; height:48px;}
</style>
</head>
<body>

  <div id="idleScreen">
    <h1 id="connStatus">Csatlakozás…</h1>
    <p id="waitMsg" style="display:none;">Várakozás, hogy az operátor kiválasszon egy dalt…</p>
    <div id="qrBox" style="display:none;"></div>
    <p id="qrCaption" style="display:none;">Oszd meg másokkal — olvassák be a QR-kódot</p>
  </div>

  <div id="songScreen">
    <div id="songTitleBar"></div>
    <iframe id="songFrame"></iframe>
    <div id="pdfContainer"></div>
    <div id="miniQrBar">
      <span>Oszd meg — olvasd be a QR-kódot</span>
      <div id="miniQr"></div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="firebase-config.js"></script>
<script>
  // PDF.js beállítása — a PDF-et közvetlenül ezen az oldalon rajzoljuk ki,
  // így nincs külső átirányítás és nem indul el letöltés sehol.
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const songRef = db.ref('currentSong');

  const connStatus = document.getElementById('connStatus');
  const waitMsg = document.getElementById('waitMsg');
  const qrBox = document.getElementById('qrBox');
  const qrCaption = document.getElementById('qrCaption');
  const idleScreen = document.getElementById('idleScreen');
  const songScreen = document.getElementById('songScreen');
  const songTitleBar = document.getElementById('songTitleBar');
  const songFrame = document.getElementById('songFrame');
  const pdfContainer = document.getElementById('pdfContainer');

  // QR kód, ami saját magára (erre a viewer oldalra) mutat
  new QRCode(qrBox, {
    text: window.location.href.split('#')[0],
    width: 200,
    height: 200
  });

  // Kis QR kód, ami akkor is látszik, amikor már megy egy dal
  new QRCode(document.getElementById('miniQr'), {
    text: window.location.href.split('#')[0],
    width: 64,
    height: 64
  });

  let renderToken = 0;

  async function renderPdf(url){
    const myToken = ++renderToken;
    pdfContainer.innerHTML = '<div id="pdfStatus">Betöltés…</div>';
    try{
      const pdf = await pdfjsLib.getDocument(url).promise;
      if(myToken !== renderToken) return;   // közben másik dalra váltottak
      pdfContainer.innerHTML = '';
      const targetWidth = pdfContainer.clientWidth || 800;
      for(let i = 1; i <= pdf.numPages; i++){
        const page = await pdf.getPage(i);
        if(myToken !== renderToken) return;
        const base = page.getViewport({ scale: 1 });
        // 2x felbontás az élesebb képért
        const viewport = page.getViewport({ scale: (targetWidth / base.width) * 2 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        pdfContainer.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        if(myToken !== renderToken) return;
      }
    } catch(e){
      if(myToken !== renderToken) return;
      pdfContainer.innerHTML = '<div id="pdfStatus">A PDF-et nem sikerült betölteni.</div>';
      console.error(e);
    }
  }

  songRef.on('value', (snap) => {
    connStatus.style.display = 'none';

    const data = snap.val();

    if(!data || !data.url){
      // Nincs még kiválasztott dal
      renderToken++;                   // futó PDF-rajzolás leállítása
      songScreen.style.display = 'none';
      idleScreen.style.display = 'flex';
      waitMsg.style.display = 'block';
      qrBox.style.display = 'inline-block';
      qrCaption.style.display = 'block';
      return;
    }

    // Van kiválasztott dal -> mutassuk
    idleScreen.style.display = 'none';
    songScreen.style.display = 'flex';
    songTitleBar.textContent = data.title || '';

    if(data.type === 'pdf'){
      songFrame.style.display = 'none';
      songFrame.src = 'about:blank';
      pdfContainer.style.display = 'block';
      pdfContainer.scrollTop = 0;
      renderPdf(new URL(data.url, window.location.href).href);
    } else {
      renderToken++;                   // futó PDF-rajzolás leállítása
      pdfContainer.style.display = 'none';
      pdfContainer.innerHTML = '';
      songFrame.style.display = 'block';
      songFrame.src = data.url;
    }
  }, (err) => {
    connStatus.textContent = 'Kapcsolódási hiba — ellenőrizd a firebase-config.js beállításait.';
    connStatus.style.display = 'block';
    console.error(err);
  });
</script>
</body>
</html>
